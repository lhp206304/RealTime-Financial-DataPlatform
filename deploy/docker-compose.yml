# 统一连接配置：所有 Python 服务（spark / airflow / api）共用这一套环境变量。
# 命名按基础设施资源（MINIO_* / CLICKHOUSE_* ...），与 batch/api 的 settings 字段一一对应。
# ${VAR:?msg}：变量未设置或空时，docker compose 启动直接报错退出（真实值放 deploy/.env，不入 git）。
# 密码字段用 ${VAR?msg}（无冒号）：允许空字符串（本地无密码），但变量必须存在。
x-conn-env: &conn-env
  # MinIO
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT 未设置，请检查 deploy/.env}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY 未设置}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY 未设置}
  MINIO_BUCKET_DIM: ${MINIO_BUCKET_DIM:?MINIO_BUCKET_DIM 未设置}
  MINIO_BUCKET_FACT: ${MINIO_BUCKET_FACT:?MINIO_BUCKET_FACT 未设置}
  # ClickHouse（HTTP 8123：api / batch / Spark Catalog）
  CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:?CLICKHOUSE_HOST 未设置}
  CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:?CLICKHOUSE_HTTP_PORT 未设置}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:?CLICKHOUSE_USER 未设置}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD?CLICKHOUSE_PASSWORD 未设置（允许空密码，但变量必须存在）}
  CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:?CLICKHOUSE_DATABASE 未设置}
  # StarRocks（MySQL 9030：api 实时查询）
  STARROCKS_HOST: ${STARROCKS_HOST:?STARROCKS_HOST 未设置}
  STARROCKS_MYSQL_PORT: ${STARROCKS_MYSQL_PORT:?STARROCKS_MYSQL_PORT 未设置}
  STARROCKS_USER: ${STARROCKS_USER:?STARROCKS_USER 未设置}
  STARROCKS_PASSWORD: ${STARROCKS_PASSWORD?STARROCKS_PASSWORD 未设置（允许空密码，但变量必须存在）}
  STARROCKS_DATABASE: ${STARROCKS_DATABASE:?STARROCKS_DATABASE 未设置}
  # Redis
  REDIS_HOST: ${REDIS_HOST:?REDIS_HOST 未设置}
  REDIS_PORT: ${REDIS_PORT:?REDIS_PORT 未设置}
  REDIS_DB: ${REDIS_DB:?REDIS_DB 未设置}
  # Spark
  SPARK_MASTER: ${SPARK_MASTER:?SPARK_MASTER 未设置}

x-spark-common: &spark-common
  build: ../batch # 构建上下文 = batch/ 目录，读 batch/Dockerfile（新机器必须先 build）
  image: batch-spark:4.2.0
  environment:
    <<: *conn-env
    PYTHONPATH: /opt/jobs:/opt
  working_dir: /opt/jobs
  volumes:
    - ../batch:/opt/jobs
    - ../shared:/opt/shared            # 共享模块（shared.log）挂载，开发热更
    - ../clickhouse/ddl:/opt/clickhouse/ddl:ro

x-airflow-image: &airflow-image
  build: ../airflow
  image: batch-airflow:latest
  # 注意：environment 是嵌套字典，服务级 << 浅合并会把它整个覆盖，
  # 所以单独定义值锚点，在每个服务的 environment 内部用 <<: *airflow-base-env 合并
  environment: &airflow-base-env
    <<: *conn-env
    PYTHONPATH: /opt/jobs:/opt
    # webserver 拉取 worker/scheduler 子进程日志（8793 端口）的鉴权密钥，
    # 所有 airflow 组件必须一致，否则 UI 看日志报 403 FORBIDDEN
    AIRFLOW__WEBSERVER__SECRET_KEY: "airflow-dev-secret-key-please-change-in-prod"
      # SparkSubmitOperator 的 spark_default 连接：host 即 spark-submit --master 的值。
    # 不配置的话 hook 找不到连接会静默回退 yarn（本集群是 standalone，没有 YARN）
    AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type": "spark", "host": "spark://spark-master:7077"}'



services:
  broker:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    hostname: broker
    container_name: broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      - kafka_data:/var/lib/kafka/data
  # 一次性任务：等 broker 起来后建 topic transaction（3 分区），建完即退出
  init-kafka:
    image: apache/kafka:4.3.1
    container_name: init-kafka
    depends_on:
      - broker
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      # 轮询等待 broker 可用（容器内用 broker:19092，不是 localhost:9092）
      until /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 --list; do
        echo '等待 broker 就绪...'; sleep 2;
      done
      # 幂等建表：已存在不报错
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 \
        --create --if-not-exists --topic transaction --partitions 3 --replication-factor 1
      echo 'topic transaction 已就绪'
      "
  starrocks:
    image: starrocks/allin1-ubuntu:3.5-latest
    hostname: starrocks
    container_name: starrocks
    ports:
      - "9030:9030" # MySQL 协议端口（客户端连这个）
      - "8030:8030" # FE HTTP（Web UI / Stream Load）
      - "8040:8040" # BE HTTP（Stream Load 重定向目标）
      - "9060:9060" # BE Thrift（Spark Connector 读数据时直连 BE，FE 下发 127.0.0.1:9060）
    volumes:
      - starrocks_data:/data/deploy/starrocks
  jobmanager:
    image: flink:1.20-java17
    command: jobmanager
    container_name: jobmanager
    ports:
      - "8081:8081" # Web UI
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        # ---- 状态后端 + Checkpoint ----
        state.backend: rocksdb
        state.checkpoints.dir: s3a://finance-checkpoints/flink
        execution.checkpointing.interval: 10s
        execution.checkpointing.mode: AT_LEAST_ONCE
        execution.checkpointing.timeout: 60s
        execution.checkpointing.min-pause: 5s
        execution.checkpointing.tolerable-failed-checkpoints: 3
        # ---- S3 连接 MinIO ----
        s3.endpoint: http://minio:9000
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
        s3.path.style.access: true
    volumes:
      # 单文件挂载：往原生 lib 里塞 connector jar，不覆盖整个目录
      - ../flink/lib/flink-sql-connector-kafka-3.4.0-1.20.jar:/opt/flink/lib/flink-sql-connector-kafka-3.4.0-1.20.jar
      - ../flink/lib/flink-connector-starrocks-1.2.14_flink-1.20.jar:/opt/flink/lib/flink-connector-starrocks-1.2.14_flink-1.20.jar
      - ../flink/lib/flink-udf-1.0.jar:/opt/flink/lib/flink-udf-1.0.jar # ← 新增这行
      - ../flink/lib/flink-s3-fs-hadoop-1.20.0.jar:/opt/flink/lib/flink-s3-fs-hadoop-1.20.0.jar
      - ../flink/sql:/opt/flink/sql
  taskmanager:
    image: flink:1.20-java17
    command: taskmanager
    container_name: taskmanager
    depends_on:
      - jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 10
        # ---- 状态后端 + Checkpoint ----
        state.backend: rocksdb
        state.checkpoints.dir: s3a://finance-checkpoints/flink
        execution.checkpointing.interval: 10s
        execution.checkpointing.mode: AT_LEAST_ONCE
        execution.checkpointing.timeout: 60s
        execution.checkpointing.min-pause: 5s
        execution.checkpointing.tolerable-failed-checkpoints: 3
        # ---- S3 连接 MinIO ----
        s3.endpoint: http://minio:9000
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
        s3.path.style.access: true
    volumes:
      # 单文件挂载：往原生 lib 里塞 connector jar，不覆盖整个目录
      - ../flink/lib/flink-sql-connector-kafka-3.4.0-1.20.jar:/opt/flink/lib/flink-sql-connector-kafka-3.4.0-1.20.jar
      - ../flink/lib/flink-connector-starrocks-1.2.14_flink-1.20.jar:/opt/flink/lib/flink-connector-starrocks-1.2.14_flink-1.20.jar
      - ../flink/lib/flink-s3-fs-hadoop-1.20.0.jar:/opt/flink/lib/flink-s3-fs-hadoop-1.20.0.jar
      - ../flink/lib/flink-udf-1.0.jar:/opt/flink/lib/flink-udf-1.0.jar # ← 新增这行
  minio:
    image: minio/minio:latest
    hostname: minio
    container_name: minio
    ports:
      - "9000:9000" # S3 API 端口（PySpark / 代码连这个）
      - "9001:9001" # Web 控制台（浏览器访问）
    environment:
      MINIO_ROOT_USER: minioadmin # 登录用户名（相当于 AWS Access Key）
      MINIO_ROOT_PASSWORD: minioadmin # 登录密码（相当于 Secret Key）
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # minio 镜像极简（无 curl/wget/grep/cat），纯 shell 内建命令读 /proc/net/tcp
      # 9000 端口 = 0x2328，LISTEN 状态 = 0A
      test: ["CMD-SHELL", "while IFS= read -r l; do case \"$$l\" in *:2328*0A*) exit 0;; esac; done < /proc/net/tcp; exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    hostname: redis
    container_name: redis
    ports:
      - "6379:6379" # 维表缓存：批 T+1 同步写，Flink Lookup Join 读
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    hostname: clickhouse
    container_name: clickhouse
    ports:
      - "8123:8123" # HTTP 接口（clickhouse-connect Python 客户端用这个）
      - "9002:9000" # 原生 TCP 接口（宿主机 9002，避免 MinIO 9000 冲突）
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      # clickhouse-client 探活最可靠（走原生 9000 端口，不依赖 HTTP 8123）
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' | grep -q 1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # FastAPI 服务层：实时查 StarRocks、离线查 ClickHouse（无状态，不挂卷）
  api:
    build: ../api                # 读 api/Dockerfile
    image: finance-api:latest
    container_name: api
    ports:
      - "8000:8000"              # FastAPI HTTP（浏览器/外部访问）
    environment:
      <<: *conn-env              # 容器内连 starrocks/clickhouse 用服务名
      # /app：app 包所在目录（uvicorn app.main:app 依赖此路径）
      # /opt：共享模块（shared.log 等）挂载点的父目录，使 shared/ 成为可 import 的包
      PYTHONPATH: /app:/opt
    volumes:
      - ../shared:/opt/shared    # 共享模块挂载，开发热更
    depends_on:
      - starrocks
      - clickhouse
    healthcheck:
      # python:3.11-slim 不带 curl，用 urllib 探活 /health
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 3s
      retries: 5


  spark-master:
    <<: *spark-common
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"               # Master Web UI
      - "7077:7077"               # Master RPC（worker 和 spark-submit 连这个）
    healthcheck:
      # spark-master 镜像带 curl，探活 Web UI 是否返回 200
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  spark-worker:
    <<: *spark-common
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    deploy:
      replicas: 2                  # worker 数量，按需调整

  postgres:
    image: postgres:16-alpine
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]   # 容器起来 ≠ 能连，探活到可接受连接为止
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-image
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy          # 等 pg_isready 通过再 migrate，避免首启撞库未就绪
    environment:
      <<: *airflow-base-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com || true
      "

  airflow-webserver:
    <<: *airflow-image
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully   # 等 init 容器正常退出（建表+建用户完成）再启动
    ports:
      - "8088:8080"          # Airflow Web UI（避开 Spark Master 的 8080）
    environment:
      <<: *airflow-base-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ""   # 生产要生成：python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../batch:/opt/jobs             # 作业代码（SparkSubmitOperator 的 application 路径）
      - ../generator:/opt/generator    # 每日造数脚本（generate section 的 BashOperator 在这跑）
      - ../shared:/opt/shared          # 共享模块（shared.log）挂载
      - ../clickhouse/ddl:/opt/clickhouse/ddl:ro  # client 模式 driver 跑在本容器，ensure_table 要读 DDL
      - airflow_logs:/opt/airflow/logs # 与 scheduler 共享日志，webserver 直接读本地日志（绕过 Airflow 2.9 log server DetachedInstanceError bug）
    command: airflow webserver

  airflow-scheduler:
    <<: *airflow-image
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy     # 造数/批管道读写 parquet
      redis:
        condition: service_healthy     # sync_dim_redis 写维表缓存
      clickhouse:
        condition: service_healthy     # ods/dwd/dws/ads 写数仓
      spark-master:
        condition: service_healthy     # SparkSubmitOperator 提交作业
    environment:
      <<: *airflow-base-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ""
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../batch:/opt/jobs
      - ../generator:/opt/generator    # 每日造数脚本（LocalExecutor 任务实际在 scheduler 容器跑）
      - ../shared:/opt/shared          # 共享模块（shared.log）挂载
      - ../clickhouse/ddl:/opt/clickhouse/ddl:ro  # client 模式 driver 跑在本容器，ensure_table 要读 DDL
      - airflow_logs:/opt/airflow/logs # 与 webserver 共享日志，让 webserver 能直接读本地日志文件
    command: airflow scheduler


volumes:
  kafka_data:
  starrocks_data:
  minio_data:
  redis_data:
  clickhouse_data:
  postgres_data:
  airflow_logs:              # webserver + scheduler 共享，webserver 直接读本地日志文件