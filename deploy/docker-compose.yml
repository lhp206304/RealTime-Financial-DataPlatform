services:
  broker:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    hostname: broker
    container_name: broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      - kafka_data:/var/lib/kafka/data
  starrocks:
    image: starrocks/allin1-ubuntu:3.5-latest
    hostname: starrocks
    container_name: starrocks
    ports:
      - "9030:9030"   # MySQL 协议端口（客户端连这个）
      - "8030:8030"   # FE HTTP（Web UI / Stream Load）
      - "8040:8040"   # BE HTTP
    volumes:
      - starrocks_data:/data/deploy/starrocks
  jobmanager:
    image: flink:1.20-java17
    command: jobmanager
    container_name: jobmanager
    ports:
      - "8081:8081" # Web UI
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
    volumes:
      # 单文件挂载：往原生 lib 里塞 connector jar，不覆盖整个目录
      - ../flink/lib/flink-sql-connector-kafka-3.4.0-1.20.jar:/opt/flink/lib/flink-sql-connector-kafka-3.4.0-1.20.jar
      - ../flink/lib/flink-connector-starrocks-1.2.14_flink-1.20.jar:/opt/flink/lib/flink-connector-starrocks-1.2.14_flink-1.20.jar
  taskmanager:
    image: flink:1.20-java17
    command: taskmanager
    container_name: taskmanager
    depends_on:
      - jobmanager
    environment: 
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      # 单文件挂载：往原生 lib 里塞 connector jar，不覆盖整个目录
      - ../flink/lib/flink-sql-connector-kafka-3.4.0-1.20.jar:/opt/flink/lib/flink-sql-connector-kafka-3.4.0-1.20.jar
      - ../flink/lib/flink-connector-starrocks-1.2.14_flink-1.20.jar:/opt/flink/lib/flink-connector-starrocks-1.2.14_flink-1.20.jar
volumes:
  kafka_data:
  starrocks_data: