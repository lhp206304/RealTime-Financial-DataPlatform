services:
  broker:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    hostname: broker
    container_name: broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      - kafka_data:/var/lib/kafka/data
  # 一次性任务：等 broker 起来后建 topic transaction（3 分区），建完即退出
  init-kafka:
    image: apache/kafka:4.3.1
    container_name: init-kafka
    depends_on:
      - broker
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      # 轮询等待 broker 可用（容器内用 broker:19092，不是 localhost:9092）
      until /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 --list; do
        echo '等待 broker 就绪...'; sleep 2;
      done
      # 幂等建表：已存在不报错
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 \
        --create --if-not-exists --topic transaction --partitions 3 --replication-factor 1
      echo 'topic transaction 已就绪'
      "
  starrocks:
    image: starrocks/allin1-ubuntu:3.5-latest
    hostname: starrocks
    container_name: starrocks
    ports:
      - "9030:9030" # MySQL 协议端口（客户端连这个）
      - "8030:8030" # FE HTTP（Web UI / Stream Load）
      - "8040:8040" # BE HTTP（Stream Load 重定向目标）
      - "9060:9060" # BE Thrift（Spark Connector 读数据时直连 BE，FE 下发 127.0.0.1:9060）
    volumes:
      - starrocks_data:/data/deploy/starrocks
  jobmanager:
    image: flink:1.20-java17
    command: jobmanager
    container_name: jobmanager
    ports:
      - "8081:8081" # Web UI
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
    volumes:
      # 单文件挂载：往原生 lib 里塞 connector jar，不覆盖整个目录
      - ../flink/lib/flink-sql-connector-kafka-3.4.0-1.20.jar:/opt/flink/lib/flink-sql-connector-kafka-3.4.0-1.20.jar
      - ../flink/lib/flink-connector-starrocks-1.2.14_flink-1.20.jar:/opt/flink/lib/flink-connector-starrocks-1.2.14_flink-1.20.jar
      - ../flink/lib/flink-udf-1.0.jar:/opt/flink/lib/flink-udf-1.0.jar # ← 新增这行
      - ../flink/sql:/opt/flink/sql
  taskmanager:
    image: flink:1.20-java17
    command: taskmanager
    container_name: taskmanager
    depends_on:
      - jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      # 单文件挂载：往原生 lib 里塞 connector jar，不覆盖整个目录
      - ../flink/lib/flink-sql-connector-kafka-3.4.0-1.20.jar:/opt/flink/lib/flink-sql-connector-kafka-3.4.0-1.20.jar
      - ../flink/lib/flink-connector-starrocks-1.2.14_flink-1.20.jar:/opt/flink/lib/flink-connector-starrocks-1.2.14_flink-1.20.jar
      - ../flink/lib/flink-udf-1.0.jar:/opt/flink/lib/flink-udf-1.0.jar # ← 新增这行
  minio:
    image: minio/minio:latest
    hostname: minio
    container_name: minio
    ports:
      - "9000:9000" # S3 API 端口（PySpark / 代码连这个）
      - "9001:9001" # Web 控制台（浏览器访问）
    environment:
      MINIO_ROOT_USER: minioadmin # 登录用户名（相当于 AWS Access Key）
      MINIO_ROOT_PASSWORD: minioadmin # 登录密码（相当于 Secret Key）
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    hostname: redis
    container_name: redis
    ports:
      - "6379:6379" # 维表缓存：批 T+1 同步写，Flink Lookup Join 读
    volumes:
      - redis_data:/data

volumes:
  kafka_data:
  starrocks_data:
  minio_data:
  redis_data:
